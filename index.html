      jeux: ['Salle de jeux', ['Les ', 'mini-jeux', ''], 'Pour patienter entre deux dégustations. Sans effet sur le concours, ni sur ta digestion.']
    };

    function renderMain(me) {
      const nav = el('nav', { class: 'tabs', role: 'tablist', 'aria-label': 'Sections' },
        TABS.map(([key, label]) => el('button', {
          type: 'button',
          role: 'tab',
          'aria-selected': String(key === currentTab),
          onclick: () => {
            if (key === currentTab && round) return;
            cancelRound();
            gameEnd = null;
            pizzaDraft = null;
            currentTab = key;
            render();
          }
        }, [art(TAB_ICONS[key]), document.createTextNode(label)]))
      );
      if (currentTab !== 'jeux' || round || gameEnd) shownEmperors = {};
      const panel = el('section', { role: 'tabpanel', 'aria-label': TABS.find(t => t[0] === currentTab)[1] });
      if (currentTab === 'pizza') renderMyPizza(panel, me);
      else if (currentTab === 'voter') renderVoter(panel, me);
      else if (currentTab === 'classement') renderRanking(panel, me);
      else renderGames(panel);

      const [eyebrow, titleParts, lead] = SECTIONS[currentTab];
      // On a phone a running round hides the bottom tab bar, so a stray tap can't end it.
      app.classList.toggle('playing', Boolean(round));
      app.replaceChildren(
        topbar([
          brand(),
          nav,
          el('p', { class: 'user-chip' }, [
            el('span', { class: 'initial', text: me.pseudo.charAt(0).toUpperCase(), 'aria-hidden': 'true' }),
            el('span', { class: 'name', text: 'Salut, ' + me.pseudo })
          ])
        ]),
        el('main', { class: 'page' }, [
          // A running round takes the whole page, so the heading and the joke step aside.
          round ? null : el('div', { class: 'section-head' }, [
            el('p', { class: 'eyebrow', text: eyebrow }),
            title(titleParts),
            el('p', { class: 'lead', text: lead })
          ]),
          round ? null : jokeStrip(),
          panel
        ])
      );
      if (mafia) app.appendChild(mafiaScene());
      if (mafia) app.querySelector('.mafia button').focus();
    }

    function jokeStrip() {
      const text = el('p', { class: 'joke-text', 'aria-live': 'polite', text: JOKES[jokeIndex] });
      return el('div', { class: 'joke' }, [
        el('div', { class: 'joke-chef' }, [art(avatarMarkup('Pattin'))]),
        el('div', { class: 'joke-body' }, [el('p', { class: 'joke-label', text: 'La blague lourde de Pattin, le patron' }), text]),
        el('button', {
          type: 'button',
          class: 'btn-secondary joke-next',
          text: 'Une autre !',
          onclick: () => {
            jokeIndex = (jokeIndex + 1) % JOKES.length;
            text.textContent = JOKES[jokeIndex];
          }
        })
      ]);
    }

    // The screen goes black and the Famiglia has a word about the pineapple.
    function mafiaScene() {
      return el('div', { class: 'mafia', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'mafia-title' }, [
        el('div', { class: 'mafia-inner' }, [
          el('h2', { class: 'visually-hidden', id: 'mafia-title', text: 'La Famiglia n\'aime pas l\'ananas' }),
          el('div', { class: 'mafiosi' }, MAFIOSI.map((m, i) => el('div', { class: 'mafioso m' + (i + 1) }, [
            el('p', { class: 'speech' }, [el('strong', { text: m.name }), el('span', { text: m.line })]),
            art(mafiosoMarkup(m))
          ]))),
          el('p', { class: 'mafia-caption', text: 'Ta partie a mystérieusement disparu. Aucun témoin, aucun score.' }),
          el('button', { type: 'button', class: 'btn-primary mafia-close', text: 'Pardon, Don. Je ne le ferai plus.', onclick: leaveTheFamily })
        ])
      ]);
    }

    function callTheFamily() {
      cancelRound();
      gameEnd = null;
      mafia = true;
      render();
    }

    function leaveTheFamily() {
      mafia = false;
      render();
      const play = Array.from(app.querySelectorAll('button')).find(b => b.textContent === 'Jouer');
      if (play) play.focus();
    }

    document.addEventListener('keydown', event => {
      if (mafia && event.key === 'Escape') leaveTheFamily();
    });

    function renderMyPizza(panel, me) {
      const mine = state.pizzas.find(z => z.participant_id === me.id);
      if (pizzaDraft && pizzaDraft.editing !== Boolean(mine)) pizzaDraft = null;
      if (mine && !pizzaDraft) {
        const { count, avg } = pizzaStats(mine.id);
        const body = el('div', { class: 'body' }, [
          el('p', { class: 'eyebrow', text: 'Ta pizza' }),
          el('p', { class: 'pizza-name', text: mine.name })
        ]);
        if (count) {
          body.appendChild(el('p', { class: 'big-score', text: formatAvg(avg) }));
          body.appendChild(el('p', { class: 'stat muted', text: formatCount(count) }));
          body.appendChild(votesList(mine.id));
        } else {
          body.appendChild(el('p', { class: 'stat muted', text: 'Pas encore de note' }));
        }
        body.appendChild(el('button', {
          type: 'button',
          class: 'btn-secondary edit-pizza',
          text: 'Modifier le nom ou la photo',
          onclick: () => {
            pizzaDraft = { editing: true, name: mine.name, photo: isPhoto(mine.photo) ? mine.photo : '' };
            render();
            const input = app.querySelector('#pizza-name');
            if (input) input.focus();
          }
        }));
        panel.appendChild(el('div', { class: 'card feature' }, [pizzaMedia(mine), body]));
        return;
      }
      if (!pizzaDraft) pizzaDraft = { editing: false, name: '', photo: '' };
      const draft = pizzaDraft;
      const input = el('input', { type: 'text', id: 'pizza-name', name: 'pizza-name', maxlength: '40', autocomplete: 'off', placeholder: 'Ex. : La Truffe du Dimanche' });
      input.value = draft.name;
      input.addEventListener('input', () => { draft.name = input.value; });
      const fileInput = el('input', { type: 'file', id: 'pizza-photo', name: 'pizza-photo', accept: 'image/*' });
      const previewImg = el('img', { class: 'thumb', alt: 'Aperçu de ta photo' });
      const preview = el('div', { class: 'photo-preview', hidden: true }, [
        previewImg,
        el('button', {
          type: 'button',
          class: 'btn-secondary',
          text: 'Retirer la photo',
          onclick: () => { clearPhoto(); fileInput.focus(); }
        })
      ]);
      // The draft's photo is a reduced JPEG data URL, or '' when there is none.
      function showPhoto() {
        if (draft.photo) previewImg.src = draft.photo;
        else previewImg.removeAttribute('src');
        preview.hidden = !draft.photo;
      }
      function clearPhoto() {
        draft.photo = '';
        fileInput.value = '';
        showPhoto();
      }
      showPhoto();
      const error = el('p', { class: 'error', id: 'pizza-error', role: 'alert' });
      const submit = el('button', { type: 'submit', class: 'btn-primary', text: draft.editing ? 'Enregistrer' : 'Soumettre ma pizza' });
      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        error.textContent = '';
        if (!file) return;
        // Submitting is paused while the image is being reduced.
        submit.disabled = true;
        reducePhoto(file)
          .then(dataUrl => {
            draft.photo = dataUrl;
            showPhoto();
          })
          .catch(() => {
            clearPhoto();
            error.textContent = 'Impossible de lire cette image.';
          })
          .finally(() => { submit.disabled = false; });
      });
      const form = el('form', { class: 'card', novalidate: '' }, [
        draft.editing ? el('p', { class: 'eyebrow form-eyebrow', text: 'Modifier ta pizza' }) : null,
        el('label', { for: 'pizza-name', text: 'Nom de ta pizza' }),
        input,
        el('div', { class: 'photo-field' }, [
          el('label', { for: 'pizza-photo', text: draft.editing ? 'Nouvelle photo (facultatif)' : 'Photo de ta pizza (facultatif)' }),
          fileInput,
          preview
        ]),
        error,
        submit,
        draft.editing
          ? el('button', { type: 'button', class: 'btn-secondary cancel-edit', text: 'Annuler', onclick: () => { pizzaDraft = null; render(); } })
          : el('p', { class: 'hint', text: 'Pas obligé : tu peux voter sans pizza et soumettre la tienne plus tard.' }),
        draft.editing ? el('p', { class: 'hint', text: 'Les notes déjà reçues restent acquises.' }) : null
      ]);
      form.addEventListener('submit', async event => {
        event.preventDefault();
        submit.disabled = true;
        const result = await (draft.editing ? updatePizza(draft.name, draft.photo) : submitPizza(draft.name, draft.photo));
        submit.disabled = false;
        if (result.error) {
          error.textContent = result.error;
          input.focus();
        } else {
          pizzaDraft = null;
          render();
        }
      });
      panel.appendChild(el('div', { class: 'split' }, [
        form,
        el('aside', { class: 'card aside' }, [
          art(PIZZA_HERO),
          el('h3', { text: 'Le jury, c\'est tout le monde' }),
          el('ul', { class: 'tips' }, [
            el('li', { text: 'Une seule pizza par participant.' }),
            el('li', { text: 'Une belle photo donne envie de bien noter.' }),
            el('li', { text: 'Tu ne peux pas voter pour ta propre pizza.' }),
            el('li', { text: 'L\'ananas ? On n\'en parle pas. Jamais.' })
          ])
        ])
      ]));
    }

    function renderVoter(panel, me) {
      const others = state.pizzas.filter(z => z.participant_id !== me.id).sort(byCreatedAt);
      if (!others.length) {
        panel.appendChild(emptyState('Aucune pizza à noter pour l\'instant. Le four chauffe…'));
        return;
      }
      const grid = el('div', { class: 'pizza-grid' });
      others.forEach(pizza => {
        const body = el('div', { class: 'body' }, [
          el('p', { class: 'pizza-name', text: pizza.name }),
          el('p', { class: 'author', text: 'par ' + pseudoOf(pizza.participant_id) })
        ]);
        const myVote = state.votes.find(v => v.pizza_id === pizza.id && v.voter_id === me.id);
        if (myVote) {
          body.appendChild(el('p', { class: 'my-score', text: 'Ta note : ' + myVote.score + '/10' }));
        } else {
          const picked = pendingScores[pizza.id];
          const scores = el('div', { class: 'scores', role: 'group', 'aria-label': 'Note pour ' + pizza.name });
          for (let n = 1; n <= 10; n++) {
            scores.appendChild(el('button', {
              type: 'button',
              'aria-pressed': String(picked === n),
              text: String(n),
              onclick: () => { pendingScores[pizza.id] = n; render(); }
            }));
          }
          const error = el('p', { class: 'error', role: 'alert' });
          const confirm = el('button', {
            type: 'button',
            class: 'btn-primary',
            disabled: !picked,
            text: picked ? 'Valider ma note : ' + picked + '/10' : 'Valider ma note',
            onclick: async () => {
              confirm.disabled = true;
              const result = await castVote(pizza.id, picked);
              confirm.disabled = false;
              if (result.error) {
                error.textContent = result.error;
              } else {
                delete pendingScores[pizza.id];
                render();
              }
            }
          });
          body.appendChild(scores);
          if (picked) body.appendChild(el('p', { class: 'reaction', text: scoreReaction(picked) }));
          body.appendChild(confirm);
          body.appendChild(error);
          body.appendChild(el('p', { class: 'final', text: 'Un vote est définitif. Comme une recette de Nonna.' }));
        }
        grid.appendChild(el('article', { class: 'card pizza-card' }, [pizzaMedia(pizza), body]));
      });
      panel.appendChild(grid);
    }

    function renderRanking(panel, me) {
      const rows = ranking();
      if (!rows.length) {
        panel.appendChild(emptyState('Aucune pizza pour l\'instant. Même pas une petite Margherita ?'));
        return;
      }
      const list = el('ol', { class: 'ranking' });
      rows.forEach(({ pizza, count, avg }, i) => {
        const mine = pizza.participant_id === me.id;
        const score = count
          ? el('div', { class: 'score' }, [
              el('p', { class: 'avg', text: formatAvg(avg) }),
              el('p', { class: 'count', text: formatCount(count) })
            ])
          : el('div', { class: 'score' }, [el('p', { class: 'none', text: 'Pas encore de note' })]);
        const name = el('p', { class: 'pizza-name', text: pizza.name });
        if (mine) name.appendChild(el('span', { class: 'mine-tag', text: 'Toi' }));
        // Fun titles only once a pizza has been rated.
        const rankTitle = !count ? null : i < 3 ? RANK_TITLES[i] : i === rows.length - 1 ? LAST_TITLE : null;
        list.appendChild(el('li', { class: 'row' + (i < 3 ? ' top-' + (i + 1) : '') + (mine ? ' mine' : '') }, [
          el('span', { class: 'rank', text: String(i + 1) }),
          pizzaThumb(pizza),
          el('div', { class: 'info' }, [
            rankTitle ? el('p', { class: 'rank-title', text: rankTitle }) : null,
            name,
            el('p', { class: 'author', text: 'par ' + pseudoOf(pizza.participant_id) })
          ]),
          score,
          count ? votesList(pizza.id) : null
        ]));
      });
      panel.appendChild(list);
    }

    // ---- Mini-games: local only, no effect on the contest. ----

    const GAMES = [
      { id: 'pizzaiolo', name: 'Commandes express', rule: 'Sers un max de pizzas en 30 secondes', start: startRound, format: formatPizzas, title: 'César du four à bois' },
      { id: 'siamo', name: 'Siamo tutti', rule: 'Un nazi se pavane sur scène. Bombarde-le de trucs qui puent pendant 30 secondes.', start: startSiamo, format: formatPoints, title: 'Fléau des nazis' }
    ];
    const ROUND_MS = 30000;
    const INGREDIENTS = ['Sauce tomate', 'Mozzarella', 'Jambon', 'Champignons', 'Olives', 'Basilic', 'Chorizo', 'Poivrons'];
    // Each ingredient's illustration and topping layer.
    const INGREDIENT_KEYS = {
      'Sauce tomate': 'sauce', 'Mozzarella': 'mozza', 'Jambon': 'jambon', 'Champignons': 'champi',
      'Olives': 'olives', 'Basilic': 'basilic', 'Chorizo': 'chorizo', 'Poivrons': 'poivrons',
      'Pâte choco': 'choco', 'Fraises': 'fraises', 'Chantilly': 'chantilly', 'Bonbons': 'bonbons',
      'Sardines': 'sardines', 'Cornichons': 'cornichons', 'Frites': 'frites', 'Guimauves': 'guimauves'
    };
    // Now and then Pattin, the boss, turns up: the ingredients flip over to these and he orders
    // something nobody should eat. Served, it counts like any pizza and the usual ingredients come back.
    const WEIRD_INGREDIENTS = ['Pâte choco', 'Fraises', 'Chantilly', 'Bonbons', 'Sardines', 'Cornichons', 'Frites', 'Guimauves'];
    const WEIRD_ORDERS = [
      { name: 'Spéciale anniversaire', ingredients: ['Pâte choco', 'Fraises', 'Chantilly', 'Bonbons'] },
      { name: 'Marée sucrée', ingredients: ['Sardines', 'Chantilly', 'Guimauves'] },
      { name: 'Cantine interdite', ingredients: ['Frites', 'Pâte choco', 'Cornichons'] },
      { name: 'Cauchemar de la Nonna', ingredients: ['Sardines', 'Fraises', 'Frites', 'Cornichons'] },
      { name: 'Pattin Royale', ingredients: ['Cornichons', 'Guimauves', 'Bonbons', 'Sardines', 'Chantilly'] }
    ];
    const BOSS = 'Pattin';
    const BOSS_CHANCE = 0.2;
    const BOSS_CHEERS = ['Pattin est ravi !', 'Beurk… mais servie !', 'Le patron adore !', 'Mamma mia… servie !'];
    const ORDERS = [
      { name: 'Margherita', ingredients: ['Sauce tomate', 'Mozzarella', 'Basilic'] },
      { name: 'Regina', ingredients: ['Sauce tomate', 'Mozzarella', 'Jambon', 'Champignons'] },
      { name: 'Diavola', ingredients: ['Sauce tomate', 'Mozzarella', 'Chorizo'] },
      { name: 'Végétarienne', ingredients: ['Sauce tomate', 'Mozzarella', 'Champignons', 'Poivrons', 'Olives'] },
      { name: 'Napolitaine', ingredients: ['Sauce tomate', 'Mozzarella', 'Olives', 'Basilic'] },
      { name: 'Paysanne', ingredients: ['Sauce tomate', 'Jambon', 'Champignons', 'Olives'] }
    ];
    const CUSTOMERS = ['Luigi', 'Giulia', 'Marco', 'Sofia', 'Nonna'];
    // Circumference of the countdown ring (r = 28 on a 64×64 dial).
    const RING = 2 * Math.PI * 28;

    // The running round, or null. While it is set, live updates do not re-render the page.
    let round = null;
    // The last round's result shown on the end card, or null for the games menu.
    let gameEnd = null;
    // True while the mafiosi are on screen, after the pineapple was used.
    let mafia = false;
    const SAVE_FAILED = 'Record non enregistré : connexion impossible.';

    // This device's record for a game, from Firestore. A stored score that is not an integer ≥ 1 counts as no record.
    function readBest(gameId) {
      const best = state.game_best_scores.find(s => s.id === gameId + '_' + myUid);
      return best && Number.isInteger(best.score) && best.score >= 1 ? best.score : null;
    }

    // The game's emperor: the best valid record of all players, the oldest achieved_at on a tie, then the
    // smaller document id. null when nobody has a record.
    function emperorOf(gameId) {
      const records = state.game_best_scores
        .filter(s => s.game === gameId && Number.isInteger(s.score) && s.score >= 1)
        .sort((a, b) => b.score - a.score || a.achieved_at - b.achieved_at || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
      return records[0] || null;
    }

    // The emperor last shown per game ('<participant_id> <score>' or 'empty'), so the entrance only
    // plays when it changes. Cleared whenever the games menu leaves the screen.
    let shownEmperors = {};

    // True once this page load has uploaded (or dropped) the old localStorage records.
    let oldBestsChecked = false;

    // The record used to live in localStorage under pps-best-<game>-<uid>: upload it once when it beats
    // the Firestore record, and clear the key (only after a successful upload, so a failure retries next load).
    function uploadOldBests() {
      oldBestsChecked = true;
      GAMES.forEach(game => {
        const key = 'pps-best-' + game.id + '-' + myUid;
        const raw = localStorage.getItem(key);
        const old = raw !== null && /^\d+$/.test(raw) && Number.isSafeInteger(Number(raw)) ? Number(raw) : 0;
        const best = readBest(game.id);
        if (old >= 1 && old > (best === null ? 0 : best)) {
          saveBestScore(game.id, old).then(result => { if (result.ok) localStorage.removeItem(key); });
        } else if (raw !== null) {
          localStorage.removeItem(key);
        }
      });
    }

    function formatPizzas(n) {
      return n + (n === 1 ? ' pizza' : ' pizzas');
    }

    function formatPoints(n) {
      return n + (n === 1 ? ' point' : ' points');
    }

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // Adds the record to a finished round's end card and, when beaten, saves it in Firestore
    // without waiting. A rejected write is shown on that end card if it is still on screen.
    // The round crowns the player when the throne changes hands: empty, or held by another player
    // with a lower score (a tie keeps the earlier emperor). Pseudos are read now, so a later snapshot can't change them.
    function saveBest(end, score) {
      const best = readBest(end.game) || 0;
      const emperor = emperorOf(end.game);
      Object.assign(end, { best: Math.max(best, score), record: score >= 1 && score > best });
      if (score >= 1 && (!emperor || (emperor.participant_id !== myUid && score > emperor.score))) {
        end.crowned = {
          deposed: emperor ? emperor.participant_id : null,
          deposedPseudo: emperor ? pseudoOf(emperor.participant_id) : null,
          pseudo: currentParticipant().pseudo,
          at: Date.now()
        };
      }
      if (end.record) {
        saveBestScore(end.game, score).then(result => {
          if (!result.error || gameEnd !== end) return;
          end.saveFailed = true;
          render();
        });
      }
      return end;
    }

    function renderGames(panel) {
      if (round) return round.game === 'siamo' ? renderSiamo(panel) : renderRound(panel);
      if (gameEnd) return gameEnd.game === 'siamo' ? renderSiamoEnd(panel) : renderGameEnd(panel);
      GAMES.forEach(game => {
        const best = readBest(game.id);
        const emperor = emperorOf(game.id);
        const shown = emperor ? emperor.participant_id + ' ' + emperor.score : 'empty';
        const enter = shownEmperors[game.id] !== shown;
        shownEmperors[game.id] = shown;
        const siamo = game.id === 'siamo';
        panel.appendChild(el('div', { class: 'card game-hero' + (siamo ? ' siamo' : '') }, [
          el('div', { class: 'art' }, siamo
            ? [el('div', { class: 'siamo-hero' }, [art(STINK_LINES), art(naziMarkup(NAZI_HERO_SPLATS)), art(iconMarkup('tomatePourrie')), art(iconMarkup('oeufPourri'))])]
            : [art(OVEN)]),
          el('div', { class: 'body' }, [
            el('p', { class: 'eyebrow', text: 'Mini-jeu · 30 secondes' }),
            el('h3', { class: 'game-title', text: game.name }),
            el('p', { class: 'game-rule', text: game.rule }),
            el('ul', { class: 'icon-row', 'aria-hidden': 'true' },
              (siamo ? AMMO.map(a => a.icon) : INGREDIENTS.map(name => INGREDIENT_KEYS[name]))
                .map(key => el('li', {}, [art(iconMarkup(key))]))),
            el('div', { class: 'throne' + (enter ? ' enter' : '') }, [
              art(emperor ? EMPEROR : EMPTY_THRONE),
              el('div', {}, emperor
                ? [
                    el('p', { class: 'eyebrow', text: 'Empereur du jeu' }),
                    el('h4', { text: game.title }),
                    el('p', { class: 'ave', text: 'Ave, ' + pseudoOf(emperor.participant_id) + ' !' }),
                    el('p', { class: 'reign', text: 'Record : ' + game.format(emperor.score) })
                  ]
                : [
                    el('p', { class: 'eyebrow', text: 'Empereur du jeu' }),
                    el('h4', { text: 'Le trône est vide' }),
                    el('p', { class: 'reign', text: 'Fais un score et monte sur le trône.' })
                  ])
            ]),
            best === null ? null : el('p', { class: 'best', text: 'Ton record : ' + game.format(best) }),
            el('button', { type: 'button', class: 'btn-primary', text: 'Jouer', onclick: game.start })
          ])
        ]));
      });
    }

    function startRound() {
      gameEnd = null;
      round = { game: 'pizzaiolo', endAt: Date.now() + ROUND_MS, served: 0, mistakes: 0, order: null, added: new Set(), timer: null, view: null };
      nextOrder();
      render();
      round.timer = setInterval(tick, 200);
    }

    // Draws a new order whose pizza differs from the previous one. The boss never comes
    // for the first order, nor twice in a row.
    function nextOrder() {
      const previous = round.order;
      const special = Boolean(previous) && !previous.special && Math.random() < BOSS_CHANCE;
      const menu = special ? WEIRD_ORDERS : ORDERS;
      round.order = {
        special,
        customer: special ? BOSS : pick(CUSTOMERS),
        pizza: pick(menu.filter(o => !previous || o !== previous.pizza))
      };
      round.added = new Set();
    }

    function cancelRound() {
      if (!round) return;
      clearInterval(round.timer);
      cancelAnimationFrame(round.frame);
      round = null;
    }

    function secondsLeft() {
      return Math.max(0, Math.ceil((round.endAt - Date.now()) / 1000));
    }

    // The countdown is read from the clock on every tick, so a late tick never drifts.
    function tick() {
      if (Date.now() < round.endAt) updateClock();
      else if (round.game === 'siamo') finishSiamo();
      else finishRound();
    }

    function updateClock() {
      const left = Math.max(0, round.endAt - Date.now());
      round.view.time.textContent = String(secondsLeft());
      round.view.ring.style.strokeDashoffset = String(RING * (1 - left / ROUND_MS));
      round.view.clock.classList.toggle('hurry', left <= 5000);
    }

    function finishRound() {
      const { served, mistakes } = round;
      cancelRound();
      gameEnd = saveBest({ game: 'pizzaiolo', served, mistakes }, served);
      render();
      const again = app.querySelector('[data-action="again"]');
      if (again) again.focus();
    }

    function addIngredient(name, button) {
      if (Date.now() >= round.endAt) return finishRound();
      const needed = round.order.pizza.ingredients;
      if (needed.includes(name) && !round.added.has(name)) {
        round.added.add(name);
        button.setAttribute('aria-pressed', 'true');
        if (round.added.size === needed.length) {
          round.served++;
          round.cheer = pick(round.order.special ? BOSS_CHEERS : SERVE_CHEERS);
          nextOrder();
        }
      } else {
        round.mistakes++;
        button.classList.add('wrong');
        setTimeout(() => button.classList.remove('wrong'), 300);
      }
      updateRound();
    }

    // The counters above a running round: a countdown ring, then one box per counter, and the quit button.
    function statBox(label) {
      return el('p', { class: 'stat' }, [el('strong'), el('span', { class: 'muted', text: label })]);
    }

    function clockStat() {
      const ring = art('<svg viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="28"/><circle class="ring" cx="32" cy="32" r="28"/></svg>');
      ring.lastChild.style.strokeDasharray = String(RING);
      const time = el('strong');
      const node = el('p', { class: 'stat' }, [el('span', { class: 'clock' }, [ring, time]), el('span', { class: 'muted', text: 'secondes' })]);
      return { node, time, ring: ring.lastChild };
    }

    function sceneTop(stats) {
      return el('div', { class: 'scene-top' }, [
        el('div', { class: 'game-stats' }, stats),
        // Leaving mid-round saves no score, like switching tabs.
        el('button', { type: 'button', class: 'quit', text: '✕', 'aria-label': 'Quitter la partie', title: 'Quitter la partie', onclick: () => { cancelRound(); render(); } })
      ]);
    }

    function renderRound(panel) {
      const { node: clock, time: timeValue, ring } = clockStat();
      const served = statBox('servies');
      const mistakes = statBox('erreurs');
      const customer = el('div', { class: 'avatar-frame' });
      const order = el('p', { class: 'order', 'aria-live': 'polite' });
      const items = el('ul', { class: 'order-items', 'aria-label': 'Ingrédients de la commande' });
      const pizza = art(pizzaMarkup(LAYERS.concat(WEIRD_LAYERS), true));
      const toast = el('span', { class: 'toast', 'aria-hidden': 'true', text: SERVE_CHEERS[0] });
      // The secret ingredient peeks out from behind the board.
      const pineapple = el('button', { type: 'button', class: 'pineapple', 'aria-label': 'Ananas', title: 'Un ingrédient… secret ?', onclick: callTheFamily }, [art(PINEAPPLE)]);
      const board = el('div', { class: 'board' }, [
        pineapple,
        el('div', { class: 'plate', 'aria-hidden': 'true' }, [pizza]),
        toast
      ]);
      // Each button's ingredient is set by updateRound, as the boss swaps them all.
      const buttons = INGREDIENTS.map(() => {
        const button = el('button', { type: 'button', 'aria-pressed': 'false' });
        button.addEventListener('click', () => addIngredient(button.ingredient, button));
        return button;
      });
      const grid = el('div', { class: 'ingredients', role: 'group', 'aria-label': 'Ingrédients' }, buttons);
      round.view = {
        time: timeValue, ring, clock, served: served.firstChild, mistakes: mistakes.firstChild,
        customer, order, items, buttons, grid, board, toast, layers: Array.from(pizza.querySelectorAll('.layer')),
        orderKey: null, servedShown: round.served, special: null
      };
      updateClock();
      panel.appendChild(el('div', { class: 'play' }, [
        el('div', { class: 'card scene' }, [
          sceneTop([clock, served, mistakes]),
          el('div', { class: 'customer' }, [customer, el('div', { class: 'bubble' }, [order, items])]),
          board
        ]),
        grid
      ]));
      updateRound();
    }

    // Updates the running round in place: counters, the customer and their order, the pizza and the buttons.
    function updateRound() {
      const { view, order, added } = round;
      view.served.textContent = String(round.served);
      view.mistakes.textContent = String(round.mistakes);
      if (view.servedShown !== round.served) {
        view.servedShown = round.served;
        view.toast.textContent = round.cheer;
        view.board.classList.remove('served');
        void view.board.offsetWidth;
        view.board.classList.add('served');
      }
      if (view.orderKey !== order) {
        view.orderKey = order;
        view.customer.replaceChildren(art(avatarMarkup(order.customer)));
        view.customer.classList.toggle('boss', order.special);
        view.order.replaceChildren(...(order.special
          ? [
              el('span', { class: 'special-tag', text: 'Commande du patron' }),
              el('strong', { text: order.customer }),
              document.createTextNode(' exige sa « '),
              el('em', { text: order.pizza.name }),
              document.createTextNode(' » !')
            ]
          : [
              el('strong', { text: order.customer }),
              document.createTextNode(' veut une '),
              el('em', { text: order.pizza.name }),
              document.createTextNode(' :')
            ]));
        view.buttons.forEach(b => b.setAttribute('aria-pressed', 'false'));
        if (view.special !== order.special) swapIngredients(view, order.special);
      }
      const on = new Set(Array.from(added, name => INGREDIENT_KEYS[name]));
      view.layers.forEach(layer => layer.classList.toggle('on', on.has(layer.getAttribute('data-layer'))));
      view.items.replaceChildren(...order.pizza.ingredients.map(name =>
        el('li', { class: added.has(name) ? 'added' : '' }, [art(iconMarkup(INGREDIENT_KEYS[name])), document.createTextNode(name)])
      ));
    }

    // Puts the usual ingredients, or the boss's, on the buttons; after the first draw the tiles flip over.
    function swapIngredients(view, special) {
      const first = view.special === null;
      view.special = special;
      (special ? WEIRD_INGREDIENTS : INGREDIENTS).forEach((name, i) => {
        const button = view.buttons[i];
        button.ingredient = name;
        button.replaceChildren(art(iconMarkup(INGREDIENT_KEYS[name])), el('span', { text: name }));
      });
      view.grid.classList.toggle('weird', special);
      if (first) return;
      view.grid.classList.remove('flip');
      void view.grid.offsetWidth;
      view.grid.classList.add('flip');
    }

    // How long the coronation entrance may replay: a snapshot re-rendering the end card after that keeps it still.
    const CORONATION_MS = 1500;

    // The coronation on an end card, when the round took the throne.
    function coronation(end) {
      const { crowned } = end;
      if (!crowned) return null;
      const enter = Date.now() - crowned.at < CORONATION_MS;
      return el('div', { class: 'throne coronation' + (enter ? ' enter' : '') }, [
        art(EMPEROR),
        el('div', {}, [
          el('p', { class: 'eyebrow', text: 'Nouvel empereur !' }),
          el('h4', { text: GAMES.find(g => g.id === end.game).title }),
          el('p', { class: 'ave', text: 'Ave, ' + crowned.pseudo + ' !' }),
          el('p', { class: 'reign', text: crowned.deposed ? crowned.deposedPseudo + ' est détrôné·e.' : 'Le trône était vide : il est à toi.' })
        ])
      ]);
    }

    function renderGameEnd(panel) {
      const { served, mistakes, best, record, saveFailed } = gameEnd;
      panel.appendChild(el('div', { class: 'card end-card' }, [
        art(TROPHY),
        el('h3', { class: 'game-title', text: 'Temps écoulé !' }),
        coronation(gameEnd),
        el('p', { class: 'big-score' }, [el('strong', { text: formatPizzas(served) }), el('span', { text: served === 1 ? ' servie' : ' servies' })]),
        el('p', { class: 'verdict', text: endVerdict(served) }),
        el('p', { class: 'stat muted', text: mistakes + (mistakes === 1 ? ' erreur' : ' erreurs') }),
        best >= 1 ? el('p', { class: 'stat', text: 'Ton record : ' + formatPizzas(best) }) : null,
        record ? el('p', { class: 'record', text: 'Nouveau record !' }) : null,
        saveFailed ? el('p', { class: 'stat muted', text: SAVE_FAILED }) : null,
        el('div', { class: 'end-actions' }, [
          el('button', { type: 'button', class: 'btn-secondary', text: 'Retour aux jeux', onclick: () => { gameEnd = null; render(); } }),
          el('button', { type: 'button', class: 'btn-primary', 'data-action': 'again', text: 'Rejouer', onclick: startRound })
        ])
      ]));
    }

    // ---- Siamo tutti: pelt a strutting nazi with stinking things for 30 seconds. ----
    // The smellier the projectile, the more it scores, and the slower it flies.

    const AMMO = [
      { name: 'Tomate pourrie', icon: 'tomatePourrie', points: 1, flight: 260, color: '#c8341f' },
      { name: 'Œuf pourri', icon: 'oeufPourri', points: 2, flight: 340, color: '#d8d24a' },
      { name: 'Chaussette sale', icon: 'chaussette', points: 3, flight: 420, color: '#8f8a6e' },
      { name: 'Gorgonzola', icon: 'gorgonzola', points: 4, flight: 500, color: '#a9c08a' },
      { name: 'Poisson pourri', icon: 'poissonPourri', points: 5, flight: 580, color: '#7f906c' },
      { name: 'Bouse de vache', icon: 'bouse', points: 6, flight: 660, color: '#5b3a1e' }
    ];
    const NAZI_CRIES = [
      'Ach ! Mein uniforme !', 'Nein, nein, NEIN !', 'Ça pue, mein Gott !', 'Mon monocle !',
      'Schweinerei !', 'Je vais le dire à ma maman !', 'Pas le gorgonzola !', 'Ich kapituliere !',
      'Il fallait rester chez moi…', 'Quelle odeur ! C\'est la défaite !'
    ];
    // Hits needed for each stink level: the target turns greener, then flies come, then a cloud.
    const STINK_STEPS = [2, 6, 12];

    function startSiamo() {
      gameEnd = null;
      round = { game: 'siamo', endAt: Date.now() + ROUND_MS, score: 0, hits: 0, misses: 0, ammo: AMMO[0],
        x: 0.5, dir: 1, turnAt: 0, last: null, timer: null, frame: null, view: null };
      render();
      round.timer = setInterval(tick, 200);
      round.frame = requestAnimationFrame(walk);
    }

    // The target struts back and forth, turning at random and faster as the clock runs down.
    function walk(now) {
      const r = round;
      if (!r || r.game !== 'siamo') return;
      const dt = r.last === null ? 0 : Math.min(0.05, (now - r.last) / 1000);
      r.last = now;
      if (now >= r.turnAt) {
        r.dir = -r.dir;
        r.turnAt = now + 500 + Math.random() * 1400;
      }
      const speed = 0.22 + 0.38 * Math.min(1, 1 - (r.endAt - Date.now()) / ROUND_MS);
      r.x += r.dir * speed * dt;
      if (r.x < 0.14) { r.x = 0.14; r.dir = 1; }
      if (r.x > 0.86) { r.x = 0.86; r.dir = -1; }
      r.view.target.style.left = (r.x * 100) + '%';
      r.view.target.classList.toggle('left', r.dir < 0);
      r.frame = requestAnimationFrame(walk);
    }

    // Throws the chosen projectile from the front of the stage to a point given as fractions of the stage.
    function throwAt(px, py) {
      const r = round;
      if (Date.now() >= r.endAt) return finishSiamo();
      const ammo = r.ammo;
      const shot = el('span', { class: 'shot', 'aria-hidden': 'true' }, [art(iconMarkup(ammo.icon))]);
      r.view.stage.appendChild(shot);
      shot.animate([
        { left: '50%', top: '108%', transform: 'translate(-50%, -50%) scale(1.4) rotate(0deg)' },
        { left: (px * 100) + '%', top: (py * 100) + '%', transform: 'translate(-50%, -50%) scale(.8) rotate(600deg)' }
      ], { duration: ammo.flight, easing: 'cubic-bezier(.2, .6, .4, 1)', fill: 'forwards' });
      setTimeout(() => {
        shot.remove();
        if (round === r) land(r, ammo, px, py);
      }, ammo.flight);
    }

    // Where the projectile lands is checked against where the target is now, not where it was at the throw.
    function land(r, ammo, px, py) {
      const { stage, target, cry } = r.view;
      const s = stage.getBoundingClientRect();
      const t = target.getBoundingClientRect();
      const x = s.left + px * s.width;
      const y = s.top + py * s.height;
      const hit = x >= t.left + t.width * 0.12 && x <= t.right - t.width * 0.12 && y >= t.top && y <= t.bottom;
      const at = (node, left, top) => { node.style.left = left + '%'; node.style.top = top + '%'; return node; };
      if (hit) {
        r.score += ammo.points;
        r.hits++;
        const splat = at(el('span', { class: 'splat' }), (x - t.left) / t.width * 100, (y - t.top) / t.height * 100);
        splat.style.background = ammo.color;
        target.appendChild(splat);
        const splats = target.querySelectorAll('.splat');
        if (splats.length > 16) splats[0].remove();
        target.dataset.stink = String(STINK_STEPS.filter(n => r.hits >= n).length);
        target.classList.add('hit');
        clearTimeout(r.hitTimer);
        r.hitTimer = setTimeout(() => target.classList.remove('hit'), 350);
        cry.textContent = pick(NAZI_CRIES);
        cry.dataset.side = r.x < 0.3 ? 'left' : r.x > 0.7 ? 'right' : '';
        cry.classList.remove('show');
        void cry.offsetWidth;
        cry.classList.add('show');
      } else {
        r.misses++;
        const blot = at(el('span', { class: 'splat miss' }), px * 100, py * 100);
        blot.style.background = ammo.color;
        stage.appendChild(blot);
        setTimeout(() => blot.remove(), 1200);
      }
      const pop = at(el('span', { class: 'score-pop' + (hit ? '' : ' miss'), 'aria-hidden': 'true', text: hit ? '+' + ammo.points : 'Raté !' }), px * 100, py * 100);
      stage.appendChild(pop);
      setTimeout(() => pop.remove(), 900);
      updateSiamo();
    }

    function finishSiamo() {
      const { score, hits, misses } = round;
      cancelRound();
      gameEnd = saveBest({ game: 'siamo', score, hits, misses }, score);
      render();
      const again = app.querySelector('[data-action="again"]');
      if (again) again.focus();
    }

    function renderSiamo(panel) {
      const { node: clock, time, ring } = clockStat();
      const score = statBox('points');
      const hits = statBox('touchés');
      const cry = el('p', { class: 'cry', 'aria-live': 'polite' });
      const target = el('div', { class: 'target', 'data-stink': '0' }, [
        art(naziMarkup()),
        el('span', { class: 'flies', 'aria-hidden': 'true' }, [el('i'), el('i'), el('i')]),
        cry
      ]);
      const stage = el('div', { class: 'stage', role: 'button', tabindex: '0', 'aria-label': 'Lancer le projectile choisi' }, [
        el('p', { class: 'graffiti', 'aria-hidden': 'true', text: 'Siamo tutti antifascisti' }),
        target
      ]);
      // A tap throws at the tapped point; the keyboard throws at the middle of the stage.
      stage.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        const s = stage.getBoundingClientRect();
        throwAt((e.clientX - s.left) / s.width, (e.clientY - s.top) / s.height);
      });
      stage.addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
        throwAt(0.5, 0.55);
      });
      const buttons = AMMO.map(ammo => el('button', { type: 'button', 'aria-pressed': 'false', onclick: () => { round.ammo = ammo; updateSiamo(); } }, [
        art(iconMarkup(ammo.icon)),
        el('span', { text: ammo.name }),
        el('span', { class: 'pts', text: '+' + formatPoints(ammo.points) })
      ]));
      round.view = { time, ring, clock, score: score.firstChild, hits: hits.firstChild, stage, target, cry, buttons };
      updateClock();
      panel.appendChild(el('div', { class: 'play' }, [
        el('div', { class: 'card scene' }, [
          sceneTop([clock, score, hits]),
          el('p', { class: 'aim-hint muted', text: 'Choisis un projectile, puis touche la scène pour le lancer. Plus ça pue, plus ça rapporte… et plus ça vole lentement.' }),
          stage
        ]),
        el('div', { class: 'ingredients ammo', role: 'group', 'aria-label': 'Projectiles' }, buttons)
      ]));
      updateSiamo();
    }

    function updateSiamo() {
      const { view, ammo } = round;
      view.score.textContent = String(round.score);
      view.hits.textContent = String(round.hits);
      view.buttons.forEach((button, i) => button.setAttribute('aria-pressed', String(AMMO[i] === ammo)));
    }

    function siamoVerdict(score) {
      if (score === 0) return 'Il est reparti tout propre. Même Pattin vise mieux, et il a de la farine dans les yeux.';
      if (score <= 10) return 'Il sent vaguement le fromage. C\'est un début.';
      if (score <= 25) return 'Il pue la défaite. Bella ciao !';
      if (score <= 45) return 'Il a fui jusqu\'à la frontière en se bouchant le nez.';
      return 'Plus personne n\'ose s\'approcher de lui. La Nonna est fière de toi.';
    }

    function renderSiamoEnd(panel) {
      const { score, hits, misses, best, record, saveFailed } = gameEnd;
      panel.appendChild(el('div', { class: 'card end-card' }, [
        el('div', { class: 'end-nazi', 'data-stink': String(STINK_STEPS.filter(n => hits >= n).length) }, [art(naziMarkup(hits ? NAZI_HERO_SPLATS : ''))]),
        el('p', { class: 'eyebrow', text: 'Siamo tutti antifascisti !' }),
        el('h3', { class: 'game-title', text: 'Temps écoulé !' }),
        coronation(gameEnd),
        el('p', { class: 'big-score' }, [el('strong', { text: String(score) }), el('span', { text: score === 1 ? ' point' : ' points' })]),
        el('p', { class: 'verdict', text: siamoVerdict(score) }),
        el('p', { class: 'stat muted', text: hits + (hits === 1 ? ' touché' : ' touchés') + ' · ' + misses + (misses === 1 ? ' raté' : ' ratés') }),
        best >= 1 ? el('p', { class: 'stat', text: 'Ton record : ' + formatPoints(best) }) : null,
        record ? el('p', { class: 'record', text: 'Nouveau record !' }) : null,
        saveFailed ? el('p', { class: 'stat muted', text: SAVE_FAILED }) : null,
        el('div', { class: 'end-actions' }, [
          el('button', { type: 'button', class: 'btn-secondary', text: 'Retour aux jeux', onclick: () => { gameEnd = null; render(); } }),
          el('button', { type: 'button', class: 'btn-primary', 'data-action': 'again', text: 'Rejouer', onclick: startSiamo })
        ])
      ]));
    }

    function renderMessage(text) {
      app.classList.remove('playing');
      app.replaceChildren(
        topbar([brand()]),
        el('main', { class: 'page loading' }, [el('div', {}, [art(PIZZA_DEFAULT), el('p', { class: 'empty', text })])])
      );
    }

    function toMillis(timestamp) {
      return timestamp ? timestamp.toMillis() : Date.now();
    }

    // Someone wrote: mirror the collection and re-render on the same tab.
    // A form being typed in (pseudo, pizza name) is left alone unless the device's participant changed.
    // A running mini-game round, or the mafiosi's visit, is never re-rendered: the page catches up after.
    function listen() {
      const loaded = new Set();
      COLLECTIONS.forEach(name => {
        const time = name === 'game_best_scores' ? 'achieved_at' : 'created_at';
        onSnapshot(collection(db, name), snapshot => {
          const before = currentParticipant();
          state = Object.assign({}, state, {
            [name]: snapshot.docs.map(d => {
              const data = d.data({ serverTimestamps: 'estimate' });
              return Object.assign({}, data, { id: d.id, [time]: toMillis(data[time]) });
            })
          });
          const first = !loaded.has(name) && loaded.add(name).size === COLLECTIONS.length;
          if (loaded.size < COLLECTIONS.length) return;
          if (!oldBestsChecked && currentParticipant()) uploadOldBests();
          if (round || mafia) return;
          const after = currentParticipant();
          const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
          if (!first && (before && before.id) === (after && after.id) && (typing || !after)) return;
          render();
        }, () => renderMessage(NETWORK_ERROR));
      });
    }

    renderMessage('On préchauffe le four…');
    onAuthStateChanged(auth, user => {
      if (!user || myUid) return;
      myUid = user.uid;
      listen();
    });
    signInAnonymously(auth).catch(() => renderMessage(NETWORK_ERROR));
  </script>
</body>
</html>
